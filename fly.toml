# fly.toml app configuration file generated for gnix-ai on 2026-11-25T03:25:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'gnix-ai'
primary_region = 'sin'

[build]
[deploy]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
