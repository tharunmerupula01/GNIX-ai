app = 'gnix-ai'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[services]
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
    restart_limit = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]   # add any secrets here, e.g. MY_API_KEY = "value"

[deploy]
  release_command = ""
