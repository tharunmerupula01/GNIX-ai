app = "gnix-ai"
primary_region = "ams"

[build]

[env]   # add any secrets here, e.g. MY_API_KEY = "value"

[deploy]
  release_command = ""

[services]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
    restart_limit = 0
